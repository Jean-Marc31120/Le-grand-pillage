<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Nuit du 17 octobre : vitrine d'Électro+ brisée, silhouettes chargeant une camionnette, cortège et fumigène au loin, détective au premier plan">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b33"/>
      <stop offset="1" stop-color="#2c2440"/>
    </linearGradient>
    <radialGradient id="lueur" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a4d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lueurRouge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e63946" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ciel nocturne -->
  <rect width="900" height="520" fill="url(#ciel)"/>
  <circle cx="790" cy="70" r="30" fill="#e8e4cf" opacity="0.85"/>
  <circle cx="778" cy="62" r="26" fill="#1b2340"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="60" cy="50" r="2"/><circle cx="180" cy="90" r="1.6"/>
    <circle cx="320" cy="40" r="2.2"/><circle cx="480" cy="80" r="1.4"/>
    <circle cx="620" cy="36" r="1.8"/><circle cx="700" cy="110" r="1.4"/>
  </g>

  <!-- fumigène rouge au loin -->
  <circle cx="120" cy="180" r="150" fill="url(#lueurRouge)"/>
  <path d="M115 300 C 100 250, 150 230, 125 185 C 115 160, 140 140, 130 110" stroke="#e63946" stroke-width="10" fill="none" opacity="0.6" stroke-linecap="round"/>
  <!-- fumée orange -->
  <circle cx="430" cy="150" r="180" fill="url(#lueur)"/>
  <g fill="#ff8a4d" opacity="0.35">
    <circle cx="400" cy="150" r="42"/><circle cx="455" cy="120" r="55"/>
    <circle cx="505" cy="150" r="40"/><circle cx="460" cy="175" r="48"/>
  </g>

  <!-- cortège au loin : silhouettes + pancartes -->
  <g fill="#0e1428">
    <rect x="30" y="292" width="8" height="26"/><rect x="70" y="288" width="8" height="30"/>
    <rect x="105" y="294" width="8" height="24"/><rect x="150" y="290" width="8" height="28"/>
    <circle cx="34" cy="320" r="7"/><rect x="26" y="326" width="16" height="20"/>
    <circle cx="74" cy="316" r="7"/><rect x="66" y="322" width="16" height="24"/>
    <circle cx="109" cy="322" r="7"/><rect x="101" y="328" width="16" height="18"/>
    <circle cx="154" cy="318" r="7"/><rect x="146" y="324" width="16" height="22"/>
  </g>
  <g stroke-width="3">
    <rect x="18" y="262" width="62" height="24" rx="3" fill="#f4a261" stroke="#8a4b1f"/>
    <text x="49" y="278" font-family="Arial, sans-serif" font-size="11" fill="#3d2410" text-anchor="middle" font-weight="bold">VIE CHÈRE</text>
    <rect x="128" y="258" width="54" height="26" rx="3" fill="#e9c46a" stroke="#8a6d1f"/>
    <text x="155" y="275" font-family="Arial, sans-serif" font-size="11" fill="#3d3010" text-anchor="middle" font-weight="bold">17 OCT.</text>
  </g>

  <!-- façades -->
  <g>
    <rect x="560" y="150" width="150" height="230" fill="#232c4d"/>
    <rect x="700" y="180" width="130" height="200" fill="#1b2340"/>
    <g fill="#ffdf8a" opacity="0.8">
      <rect x="576" y="170" width="18" height="24"/><rect x="612" y="200" width="18" height="24"/>
      <rect x="664" y="170" width="18" height="24"/><rect x="716" y="206" width="16" height="22"/>
      <rect x="788" y="240" width="16" height="22"/>
    </g>
  </g>

  <!-- magasin Électro+ pillé -->
  <g>
    <rect x="250" y="190" width="300" height="190" fill="#31406e"/>
    <rect x="250" y="190" width="300" height="46" fill="#1f5f8b"/>
    <text x="400" y="222" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#f1faee" text-anchor="middle" letter-spacing="2">ÉLECTRO+</text>
    <!-- vitrine brisée -->
    <rect x="275" y="252" width="250" height="120" fill="#0d1326"/>
    <g stroke="#cfe8ff" stroke-width="2" opacity="0.85" fill="none">
      <path d="M330 252 L300 300 L338 330 L310 372"/>
      <path d="M382 252 L412 296 L384 322 L408 372"/>
      <path d="M462 252 L446 310 L478 348"/>
      <path d="M300 300 L382 288 M338 330 L446 310"/>
    </g>
    <!-- étalages saccagés -->
    <g fill="#55668f">
      <rect x="290" y="340" width="40" height="32"/><rect x="345" y="352" width="30" height="20"/>
      <rect x="470" y="346" width="44" height="26"/>
    </g>
    <g stroke="#8fa3d1" stroke-width="1.5">
      <path d="M350 372 L362 356 M420 372 L410 360" stroke-linecap="round"/>
    </g>
    <!-- verre au sol -->
    <g fill="#cfe8ff" opacity="0.7">
      <path d="M300 384 l8 -8 4 8z"/><path d="M352 386 l7 -7 5 7z"/>
      <path d="M418 384 l8 -8 4 8z"/><path d="M470 386 l6 -6 5 6z"/>
    </g>
  </g>

  <!-- camionnette qui charge -->
  <g>
    <rect x="560" y="312" width="150" height="58" rx="8" fill="#6b7f99"/>
    <path d="M710 322 h34 l24 26 v22 h-58z" fill="#556880"/>
    <rect x="718" y="328" width="26" height="16" fill="#bcd6f5"/>
    <circle cx="596" cy="378" r="16" fill="#101623"/><circle cx="596" cy="378" r="7" fill="#444"/>
    <circle cx="726" cy="378" r="16" fill="#101623"/><circle cx="726" cy="378" r="7" fill="#444"/>
    <rect x="560" y="362" width="204" height="6" fill="#33445e"/>
    <!-- plaque lisible -->
    <rect x="546" y="344" width="58" height="18" rx="3" fill="#f4f4ef" stroke="#1d3557" stroke-width="2"/>
    <text x="575" y="358" font-family="monospace" font-size="13" font-weight="bold" fill="#1d3557" text-anchor="middle">BK?94?</text>
    <circle cx="556" cy="330" r="5" fill="#ffe08a"/>
  </g>

  <!-- deux silhouettes avec cartons -->
  <g fill="#0b101f">
    <circle cx="520" cy="304" r="10"/>
    <path d="M510 314 h20 l6 40 h-8 l-4 -18 -4 18 h-8z"/>
    <rect x="498" y="318" width="22" height="18" fill="#c98a4b" stroke="#7a4a1c" stroke-width="1.5"/>
    <circle cx="480" cy="308" r="10"/>
    <path d="M470 318 h20 l6 38 h-8 l-4 -16 -4 16 h-8z"/>
    <rect x="462" y="322" width="20" height="16" fill="#c98a4b" stroke="#7a4a1c" stroke-width="1.5"/>
  </g>

  <!-- sol / rue -->
  <rect x="0" y="380" width="900" height="140" fill="#171d31"/>
  <g stroke="#39456b" stroke-width="4" stroke-dasharray="40 30" opacity="0.6">
    <line x1="0" y1="450" x2="900" y2="450"/>
  </g>

  <!-- détective au premier plan, ordinateur portable -->
  <g>
    <path d="M120 400 h120 v6 q0 8 -8 8 h-104 q-8 0 -8 -8z" fill="#0d1326"/>
    <circle cx="180" cy="418" r="9" fill="#ffd9b0"/>
    <path d="M166 412 h28 v-8 h-28z" fill="#1d3557"/>
    <rect x="160" y="428" width="40" height="52" rx="10" fill="#1d3557"/>
    <rect x="140" y="470" width="18" height="46" rx="6" fill="#14213d"/>
    <rect x="202" y="470" width="18" height="46" rx="6" fill="#14213d"/>
    <!-- chapeau -->
    <path d="M158 410 q22 -22 44 0 q-8 -6 -22 -6 q-14 0 -22 6z" fill="#14213d"/>
    <!-- loupe -->
    <circle cx="248" cy="436" r="16" fill="none" stroke="#e9c46a" stroke-width="5"/>
    <line x1="259" y1="447" x2="274" y2="462" stroke="#e9c46a" stroke-width="6" stroke-linecap="round"/>
    <!-- requête flottante -->
    <rect x="290" y="410" width="230" height="72" rx="10" fill="#0d1326" stroke="#4ecdc4" stroke-width="2"/>
    <text x="304" y="436" font-family="monospace" font-size="15" fill="#4ecdc4">SELECT * FROM</text>
    <text x="304" y="458" font-family="monospace" font-size="15" fill="#f4a261">personne WHERE</text>
    <text x="304" y="476" font-family="monospace" font-size="15" fill="#e9c46a">  indice = TRUE;</text>
    <line x1="264" y1="436" x2="290" y2="436" stroke="#e9c46a" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>
